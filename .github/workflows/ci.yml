name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.8.6
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: |
          pytest -v --cov=agent --cov=models --cov=RHEED_images --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: End-to-end DoE smoke test against checked-in model checkpoints
        run: |
          cd agent
          python -c "
          from doe import run_doe
          result = run_doe()
          assert result['n_runs'] == 12
          assert 'optimum' in result
          print('DoE smoke test OK:', result['optimum'])
          "
      - name: Active-learning loop smoke test
        run: |
          cd agent
          python -c "
          import pandas as pd
          from al_loop import run_al_loop
          rows = pd.read_csv('../data/train_compiled.csv').to_dict(orient='records')
          results = run_al_loop(rows, n_iterations=1, out_dir='/tmp/al_smoke')
          assert len(results) == 1
          print('AL smoke test OK:', results[0]['suggested_filamentpower'])
          "
